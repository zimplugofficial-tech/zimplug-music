<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}ZimPlug Music{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="{% if request.path == '/' %}page-home{% elif request.path.startswith('/music') %}page-music{% elif request.path.startswith('/news') %}page-news{% else %}page-other{% endif %}">

<header class="site-header">

    <a href="/" class="brand">
        <img src="{{ url_for('static', filename='images/logo.png') }}"
             alt="ZimPlug">
    </a>

    <nav class="main-nav" id="mainNav">

    <a href="/" class="nav-home {% if request.path == '/' %}active{% endif %}">
        HOME
    </a>

    <a href="/music" class="nav-music {% if request.path.startswith('/music') %}active{% endif %}">
        MUSIC
    </a>

    <a href="/news" class="nav-news {% if request.path.startswith('/news') %}active{% endif %}">
        NEWS
    </a>

    <span class="nav-sliding-dot" id="navSlidingDot"></span>

</nav>

    {% if session.get("user_id") %}
        <a href="/account" class="header-account">
            {{ session.get("user_name") }}
        </a>
    {% else %}
        <a href="/login" class="header-account">
            LOG IN
        </a>
    {% endif %}

</header>
<div id="page-content">
{% block content %}{% endblock %}
</div>

<footer class="site-footer">

    <div class="footer-logo">
        <img src="{{ url_for('static', filename='images/logo.png') }}"
             alt="ZimPlug">
        <strong>ZIMPLUG OFFICIAL</strong>
    </div>

    <div class="footer-links">
        <a href="/help">HELP</a>
        <a href="/privacy">PRIVACY POLICY</a>
        <a href="/report">REPORT</a>
        <a href="/legal">LEGAL & DMCA</a>
    </div>

    <p>© 2026 ZimPlug Official. All rights reserved.</p>

</footer>

<div class="player" id="player">

    <div class="player-info">
        <div class="player-art" id="playerArt">♪</div>

        <div>
            <strong id="playerTitle">Nothing playing</strong>
            <span id="playerArtist">Choose a song</span>
        </div>
    </div>

    <div class="player-controls">

        <button id="previousButton" aria-label="Previous song"><span class="player-icon player-prev" aria-hidden="true"></span></button>

        <button class="player-play" id="playButton" aria-label="Play"><span class="player-icon player-play-icon" aria-hidden="true"></span></button>

        <button id="nextButton" aria-label="Next song"><span class="player-icon player-next" aria-hidden="true"></span></button>

    </div>

    <audio id="audio"></audio>

</div>
<script src="{{ url_for('static', filename='js/player.js') }}"></script>
<script src="{{ url_for('static', filename='js/site-nav.js') }}"></script>

</body>
</html>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const nav = document.getElementById("mainNav");
    const dot = document.getElementById("navSlidingDot");

    if (!nav || !dot) return;

    const links = nav.querySelectorAll("a");

    function moveDot(link, animate = true) {
        if (!link) return;

        const navRect = nav.getBoundingClientRect();
        const linkRect = link.getBoundingClientRect();

        const targetX =
            (linkRect.left + linkRect.width / 2) - navRect.left;

        if (!animate) {
            dot.style.transition = "none";
        } else {
            dot.style.transition =
                "transform .42s cubic-bezier(.22,1,.36,1), opacity .2s ease";
        }

        dot.style.transform = `translateX(${targetX}px)`;
        dot.classList.add("ready");

        if (!animate) {
            requestAnimationFrame(() => {
                dot.style.transition =
                    "transform .42s cubic-bezier(.22,1,.36,1), opacity .2s ease";
            });
        }
    }

    function getActiveLink() {
        return nav.querySelector("a.active");
    }

    /* Put dot under current page */
    const activeLink = getActiveLink();

    if (activeLink) {
        moveDot(activeLink, false);
    }

    /* Slide before changing page */
    links.forEach(link => {

        link.addEventListener("click", function (event) {

            /*
             * Don't interfere with modifier clicks,
             * new tabs, middle-clicks, etc.
             */
            if (
                event.ctrlKey ||
                event.metaKey ||
                event.shiftKey ||
                event.altKey ||
                event.button !== 0
            ) {
                return;
            }

            const destination = this.href;

            event.preventDefault();

            moveDot(this, true);

            /*
             * Give the gold dot time to visibly
             * travel to the next navigation item.
             */
            setTimeout(function () {
                window.location.href = destination;
            }, 300);

        });

    });

    /* Keep position correct if browser window changes size */
    window.addEventListener("resize", function () {
        const active = getActiveLink();

        if (active) {
            moveDot(active, false);
        }
    });

});
</script>
